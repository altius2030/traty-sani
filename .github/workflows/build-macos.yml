name: Build macOS (arm64)

# Собирает .dmg на macOS-раннере GitHub.
# С Windows собрать macOS-версию нельзя: electron-builder требует системные
# утилиты macOS для создания образа диска.
#
# Подпись и обновления. Здесь приложение подписывается ad-hoc, а сборка
# публикуется только как артефакт — автообновление на macOS отключено.
# Причина в том, что оно устроено иначе, чем на Windows: Squirrel.Mac сверяет
# «designated requirement» новой сборки с требованием уже установленной
# программы, а у ad-hoc подписи отпечаток меняется при каждой сборке, поэтому
# требования никогда не совпадут. Обновление на macOS ставится вручную:
# пользователь скачивает образ и заменяет приложение в папке «Программы».
#
# Обход с ручным codesign и hdiutil нужен именно поэтому: если позволить
# electron-builder собрать .dmg самому, он перезапишет бандл и подпись ad-hoc
# пропадёт — macOS сочтёт приложение повреждённым.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build DMG (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Идентификатор подписи отключается флагом -c.mac.identity=null:
      # electron-builder по умолчанию требует сертификат и падает там,
      # где его быть не может.
      - name: Сборка
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac

      - name: Подпись бандла (ad-hoc)
        run: |
          set -e
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          [ -n "$APP" ] || { echo "app не найден"; exit 1; }

          # Снимаем карантин и переподписываем бандл целиком, чтобы
          # запечатались ресурсы и связался Info.plist.
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- итоговая подпись ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -Ei "signature|identifier|flags|sealed"
          echo "--- архитектура ---"
          lipo -archs "$APP/Contents/MacOS/"*

      - name: Создание .dmg из подписанного бандла
        run: |
          set -e
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          VERSION=$(node -p "require('./package.json').version")
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # electron-builder уже создал свои образы — БЕЗ нужной подписи.
          # Удаляем их, иначе в артефакт попадут оба, и пользователь откроет
          # неподписанный (macOS сочтёт его повреждённым).
          rm -f release/*.dmg release/*.zip

          DMG="release/Traty-Sani-${VERSION}-arm64.dmg"
          hdiutil create -volname "Traty Sani" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "--- содержимое release ---"
          ls -lh release/*.dmg
          COUNT=$(ls release/*.dmg | wc -l | tr -d ' ')
          [ "$COUNT" = "1" ] || { echo "ожидался 1 образ, найдено $COUNT"; exit 1; }

      - name: Готовый образ
        uses: actions/upload-artifact@v4
        with:
          # Версия в имени — чтобы не перепутать с предыдущими сборками
          name: Traty-Sani-mac-arm64-v${{ github.run_number }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30