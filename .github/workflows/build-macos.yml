name: Build macOS (arm64)

# Собирает .dmg на macOS-раннере GitHub.
# С Windows собрать macOS-версию нельзя: electron-builder требует системные
# утилиты macOS для создания образа диска.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build DMG (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка .app
        env:
          # Не ищем сертификат в Keychain — подписываем ad-hoc (identity: "-" в
          # package.json). Раньше подпись пропускалась целиком, и оставалась
          # только подпись линкера: macOS сообщал «приложение повреждено».
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: electron-builder --mac --arm64 --dir

      # Подпись должна быть нанесена ДО создания образа, иначе в .dmg попадёт
      # неподписанная копия. Подписываем и запечатываем бандл целиком.
      - name: Подпись бандла (ad-hoc) и снятие карантина
        run: |
          set -e
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- после подписи ---"
          codesign -dv --verbose=2 "$APP"

      - name: Проверка архитектуры
        run: |
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          lipo -archs "$APP/Contents/MacOS/"*

      - name: Сборка .dmg из подписанного бандла
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: electron-builder --mac --arm64

      - name: Готовый образ
        uses: actions/upload-artifact@v4
        with:
          name: Traty-Sani-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30