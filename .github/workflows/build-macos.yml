name: Build macOS (arm64)

# Собирает .dmg на macOS-раннере GitHub.
# С Windows собрать macOS-версию нельзя: electron-builder требует системные
# утилиты macOS для создания образа диска.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build DMG (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Без сертификата разработчика подпись невозможна; отключаем её поиск,
      # иначе electron-builder попытается искать identity и упадёт.
      - name: Сборка .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      # Проверяем, что собранный бандл валиден. Если эта проверка падает —
      # macOS при запуске скажет «приложение повреждено».
      - name: Проверка подписи и архитектуры
        run: |
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          echo "--- артетектуры ---"
          lipo -archs "$APP/Contents/MacOS/"* || true
          echo "--- plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist"

      - name: Готовый образ
        uses: actions/upload-artifact@v4
        with:
          name: Traty-Sani-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30