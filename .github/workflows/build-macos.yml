name: Build macOS (arm64)

# Собирает .dmg на macOS-раннере GitHub.
# С Windows собрать macOS-версию нельзя: electron-builder требует системные
# утилиты macOS для создания образа диска.
#
# Важно: подпись наносится отдельным шагом ДО создания образа. Если позволить
# electron-builder собрать .dmg самому, он перезапишет бандл и подпись пропадёт —
# macOS сочтёт приложение повреждённым.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build DMG (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Подготовка (renderer, main, шаблонная БД)
        run: npm run build && npm run build:template-db

      - name: Сборка
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: electron-builder --mac --arm64

      - name: Подпись бандла (ad-hoc)
        run: |
          set -e
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          [ -n "$APP" ] || { echo "app не найден"; exit 1; }

          # Снимаем карантин и переподписываем бандл целиком, чтобы
          # запечатались ресурсы и связался Info.plist.
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- итоговая подпись ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -Ei "signature|identifier|flags|sealed"
          echo "--- архитектура ---"
          lipo -archs "$APP/Contents/MacOS/"*

      - name: Создание .dmg из подписанного бандла
        run: |
          set -e
          APP=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -1)
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="release/Traty-Sani-1.0.0-arm64.dmg"
          # Перезаписываем образ, созданный electron-builder'ом без подписи.
          rm -f "$DMG"
          hdiutil create -volname "Traty Sani" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          ls -lh release/*.dmg

      - name: Готовый образ
        uses: actions/upload-artifact@v4
        with:
          name: Traty-Sani-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30