name: Build Windows (x64)

# Собирает установщик и публикует его в GitHub Releases — это и есть канал
# обновлений для electron-updater. Артефакты Actions для этого не подходят:
# они временные и требуют авторизации, а программа должна читать latest.yml
# по постоянному адресу.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: NSIS installer + publish
    runs-on: windows-latest

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # electron-builder сам создаёт latest.yml и прикрепляет установщик к
      # релизу. Публикуем только по тегу: иначе каждый пуш в main
      # перезаписывал бы «последний релиз», и установленные копии начали бы
      # предлагать себе сборку из ветки.
      #
      # Важно: запуск идёт через `npm run`, а не напрямую через npx —
      # node_modules/.bin есть в PATH только внутри npm run.
      - name: Сборка и публикация
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if ("$env:IS_TAG" -eq "true") {
            npm run release:win
          } else {
            npm run build:win
          }
        shell: pwsh

      - name: Готовый установщик
        uses: actions/upload-artifact@v4
        with:
          name: Traty-Sani-win-x64-v${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30